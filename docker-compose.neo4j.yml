# Neo4j 知识图谱（红楼梦）独立服务。
# 用法: docker compose -f docker-compose.neo4j.yml up -d
# 灌入图谱: agentkit hlm-seed          (需先安装 kg extra: pip install "neo4j>=5.26,<6")
# 默认连接: bolt://localhost:7687，账号/密码由下方 NEO4J_AUTH 指定，
# 需与 tenants/<id>.json 的 hongloumeng 配置一致。
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (Python 驱动)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      # 打开 APOC 等插件（可选，当前版本核心功能不需要）
      - NEO4J_PLUGINS=["apoc"]
      # 内存与并发调优（本地开发用小配置即可）
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
